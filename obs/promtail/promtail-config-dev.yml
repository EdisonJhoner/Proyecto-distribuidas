server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://qhalimenu-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: qhalimenu-catalogo-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-catalogo-ms
          __path__: /var/log/qhalimenu-catalogo-ms/*.log
  - job_name: qhalimenu-orden-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-orden-ms
          __path__: /var/log/qhalimenu-orden-ms/*.log
  - job_name: qhalimenu-cliente-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-cliente-ms
          __path__: /var/log/qhalimenu-cliente-ms/*.log
  - job_name: qhalimenu-auth-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-auth-ms
          __path__: /var/log/qhalimenu-auth-ms/*.log
  - job_name: qhalimenu-pago-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-pago-ms
          __path__: /var/log/qhalimenu-pago-ms/*.log
  - job_name: qhalimenu-keycloak
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-keycloak
          __path__: /var/log/qhalimenu-keycloak/*.log
  - job_name: qhalimenu-gateway
    static_configs:
      - targets: [localhost]
        labels:
          application: qhalimenu-gateway
          __path__: /var/log/qhalimenu-gateway/*.log
