name: qhalimenu-cliente-dev

services:
  postgres-cliente-dev:
    image: postgres:16-alpine
    container_name: qhalimenu-postgres-cliente-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhalimenu_cliente_db
      POSTGRES_USER: qhalimenu
      POSTGRES_PASSWORD: qhalimenu
    ports:
      - "15436:5432"
    volumes:
      - qhalimenu_cliente_dev_data:/var/lib/postgresql/data

volumes:
  qhalimenu_cliente_dev_data:
