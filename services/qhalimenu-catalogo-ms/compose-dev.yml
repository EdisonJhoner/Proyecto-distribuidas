name: qhalimenu-catalogo-dev

services:
  postgres-catalogo-dev:
    image: postgres:16-alpine
    container_name: qhalimenu-postgres-catalogo-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhalimenu_catalogo_db
      POSTGRES_USER: qhalimenu
      POSTGRES_PASSWORD: qhalimenu
    ports:
      - "15432:5432"
    volumes:
      - qhalimenu_catalogo_dev_data:/var/lib/postgresql/data

volumes:
  qhalimenu_catalogo_dev_data:
