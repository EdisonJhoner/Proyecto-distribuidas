name: qhalimenu-pago-dev

services:
  postgres-pago-dev:
    image: postgres:16-alpine
    container_name: qhalimenu-postgres-pago-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhalimenu_pago_db
      POSTGRES_USER: qhalimenu
      POSTGRES_PASSWORD: qhalimenu
    ports:
      - "15438:5432"
    volumes:
      - qhalimenu_pago_dev_data:/var/lib/postgresql/data

volumes:
  qhalimenu_pago_dev_data:
