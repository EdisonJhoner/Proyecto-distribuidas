name: qhalimenu-auth-dev

services:
  postgres-auth-dev:
    image: postgres:16-alpine
    container_name: qhalimenu-postgres-auth-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhalimenu_auth_db
      POSTGRES_USER: qhalimenu
      POSTGRES_PASSWORD: qhalimenu
    ports:
      - "15440:5432"
    volumes:
      - qhalimenu_auth_dev_data:/var/lib/postgresql/data

volumes:
  qhalimenu_auth_dev_data:
