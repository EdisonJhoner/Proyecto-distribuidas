name: qhalimenu-orden-dev

services:
  postgres-orden-dev:
    image: postgres:16-alpine
    container_name: qhalimenu-postgres-orden-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhalimenu_orden_db
      POSTGRES_USER: qhalimenu
      POSTGRES_PASSWORD: qhalimenu
    ports:
      - "15434:5432"
    volumes:
      - qhalimenu_orden_dev_data:/var/lib/postgresql/data

volumes:
  qhalimenu_orden_dev_data:
