server:
  port: 8080

spring:
  application:
    name: pagatu-catalogo-ms
  datasource:
    url: jdbc:postgresql://localhost:15432/ecomer_catalogo_db
    username: pagatu
    password: pagatu
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    pe.edu.upeu.catalogo: DEBUG
