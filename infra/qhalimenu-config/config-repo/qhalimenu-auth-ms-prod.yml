server:
  port: 8080

spring:
  application:
    name: qhalimenu-auth-ms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qhalimenu_auth_db}
    username: ${DB_USER:qhalimenu}
    password: ${DB_PASS:qhalimenu}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

qhalimenu:
  jwt:
    issuer: qhalimenu-auth-ms
    expiracion-segundos: ${JWT_EXPIRACION_SEGUNDOS:3600}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://qhalimenu-eureka:8761/eureka

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
