server:
  port: 8080

spring:
  application:
    name: qhalimenu-pago-ms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qhalimenu_pago_db}
    username: ${DB_USER:qhalimenu}
    password: ${DB_PASS:qhalimenu}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://qhalimenu-keycloak:8080/realms/qhalimenu
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: qhalimenu-pago-ms
      auto-offset-reset: earliest
    listener:
      ack-mode: record

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://qhalimenu-eureka:8761/eureka

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-YOUR-ACCESS-TOKEN}
  placeholder-token: ${MERCADOPAGO_PLACEHOLDER_TOKEN:TEST-YOUR-ACCESS-TOKEN}
  currency-id: ${MERCADOPAGO_CURRENCY:PEN}
  success-url: ${MERCADOPAGO_SUCCESS_URL:http://qhalimenu-gateway:8080/api/v1/pagos/feedback}
  failure-url: ${MERCADOPAGO_FAILURE_URL:http://qhalimenu-gateway:8080/api/v1/pagos/feedback}
  pending-url: ${MERCADOPAGO_PENDING_URL:http://qhalimenu-gateway:8080/api/v1/pagos/feedback}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://qhalimenu-gateway:8080/api/v1/pagos/webhook}
  simulation-base-url: ${MERCADOPAGO_SIMULATION_URL:http://qhalimenu-gateway:8080/api/v1/pagos/simulacion}
  simulation-id-prefix: ${MERCADOPAGO_SIMULATION_PREFIX:SIM-}

qhalimenu:
  kafka:
    topic:
      orden-eventos: ${KAFKA_TOPIC_ORDEN:orden-eventos}
      pago-eventos: ${KAFKA_TOPIC_PAGO:pago-eventos}
  outbox:
    poll-delay-ms: 2000
    initial-delay-ms: 3000
