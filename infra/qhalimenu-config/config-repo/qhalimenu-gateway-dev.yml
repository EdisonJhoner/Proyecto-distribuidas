server:
  port: 18080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: qhalimenu-catalogo-categorias
              uri: lb://qhalimenu-catalogo-ms
              predicates:
                - Path=/api/v1/categorias/**
            - id: qhalimenu-catalogo-productos
              uri: lb://qhalimenu-catalogo-ms
              predicates:
                - Path=/api/v1/productos/**
            - id: qhalimenu-orden-ordenes
              uri: lb://qhalimenu-orden-ms
              predicates:
                - Path=/api/v1/ordenes/**
            - id: qhalimenu-cliente-clientes
              uri: lb://qhalimenu-cliente-ms
              predicates:
                - Path=/api/v1/clientes/**
            - id: qhalimenu-pago-pagos
              uri: lb://qhalimenu-pago-ms
              predicates:
                - Path=/api/v1/pagos/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
