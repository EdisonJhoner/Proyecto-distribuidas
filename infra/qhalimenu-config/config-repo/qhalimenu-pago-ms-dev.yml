server:
  port: 8086

spring:
  application:
    name: qhalimenu-pago-ms
  datasource:
    url: jdbc:postgresql://localhost:15438/qhalimenu_pago_db
    username: qhalimenu
    password: qhalimenu
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/qhalimenu
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: qhalimenu-pago-ms
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
  endpoint:
    health:
      show-details: always

logging:
  level:
    pe.edu.upeu.pago: DEBUG

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  placeholder-token: TEST-YOUR-ACCESS-TOKEN
  currency-id: PEN
  success-url: http://localhost:18080/api/v1/pagos/feedback
  failure-url: http://localhost:18080/api/v1/pagos/feedback
  pending-url: http://localhost:18080/api/v1/pagos/feedback
  notification-url: http://localhost:18080/api/v1/pagos/webhook
  simulation-base-url: http://localhost:18080/api/v1/pagos/simulacion
  simulation-id-prefix: SIM-

qhalimenu:
  kafka:
    topic:
      orden-eventos: orden-eventos
      pago-eventos: pago-eventos
  outbox:
    poll-delay-ms: 2000
    initial-delay-ms: 3000
