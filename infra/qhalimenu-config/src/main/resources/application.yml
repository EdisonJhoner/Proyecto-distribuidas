server:
  port: 18888

spring:
  application:
    name: qhalimenu-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  devtools:
    restart:
      # Estabilidad en DEMO: un rebuild del IDE ya no reinicia el servicio en caliente.
      enabled: false